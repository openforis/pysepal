[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pysepal-map"
version = "0.3.0"
description = "A generic MapLibre GL JS widget for Jupyter."
readme = "README.md"
license = {text = "MIT"}
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Pierrick Rambaud", email = "pierrick.rambaud49@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = ["anywidget>=0.9", "traitlets"]

[project.urls]
Homepage = "https://github.com/openforis/pysepal"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-ipywidgets", "voila", "jupyterlab"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pysepal_map/static/widget.js", "src/pysepal_map/static/widget.css"]
include = ["src", "js", "build.mjs", "hatch_build.py", "package.json", "package-lock.json", "tsconfig.json", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pysepal_map"]
artifacts = ["src/pysepal_map/static/widget.js", "src/pysepal_map/static/widget.css"]

[tool.hatch.build.hooks.custom]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # pytest-playwright 0.10's fallback base_url fixture (used without
    # pytest-base-url) is a session fixture defined as a method, which pytest 9
    # deprecates; it is not ours to fix.
    "ignore:Session-scoped fixtures defined as instance methods:pytest.PytestRemovedIn10Warning",
]
