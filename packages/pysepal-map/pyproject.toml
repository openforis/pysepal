[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysepal-map"
version = "0.1.0"
description = "A generic MapLibre GL JS widget for Jupyter."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anywidget>=0.9", "traitlets"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-ipywidgets", "voila", "jupyterlab"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/pysepal_map/static/widget.js", "src/pysepal_map/static/widget.css"]
include = ["src", "js", "build.mjs", "hatch_build.py", "package.json", "package-lock.json", "tsconfig.json", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pysepal_map"]
artifacts = ["src/pysepal_map/static/widget.js", "src/pysepal_map/static/widget.css"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
