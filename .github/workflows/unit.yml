name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  #mypy:
  #  runs-on: ubuntu-latest
  #  steps:
  #    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
  #    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
  #      with:
  #        python-version: "3.10"
  #    - name: Install nox
  #      run: pip install nox
  #    - name: run mypy checks
  #      run: nox -s mypy

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      # Inject EE creds when triggered by push or by a same-repo PR. Forks see ''.
      EARTHENGINE_TOKEN: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.EARTHENGINE_TOKEN || '' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        ipyvuetify: ["1"]
        include:
          - os: macos-latest # macos test
            python-version: "3.11"
            ipyvuetify: "1"
          - os: windows-latest # windows test
            python-version: "3.11"
            ipyvuetify: "1"
          - python-version: "3.12" # Vuetify 3, see pysepal/_vuetify.py
            ipyvuetify: "3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install nox
        run: python -m pip install nox
      - name: test with pytest
        run: nox -s "test(ipyvuetify='${{ matrix.ipyvuetify }}')" -- -vv
      - name: codecov
        if: github.event_name == 'push' && matrix.python-version == '3.10' && runner.os == 'Linux' && matrix.ipyvuetify == '1'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
      - name: assess dead fixtures
        if: matrix.python-version == '3.10' && matrix.ipyvuetify == '1'
        run: nox -s dead-fixtures

  test_gee:
    needs: [build]
    # Job runs on push or same-repo PR (skip fork PRs).
    # Per-step if: further skips when no GEE-relevant files changed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: changes
        with:
          filters: |
            gee:
              - 'pysepal/mapping/**'
              - 'pysepal/aoi/**'
              - 'pysepal/planetapi/**'
              - 'pysepal/scripts/gee*'
              - 'pysepal/solara/**'
              - 'tests/test_mapping/**'
              - 'tests/test_aoi/**'
              - 'tests/test_solara/**'
              - 'tests/test_scripts/test_gee*'
              - 'tests/conftest.py'
              - 'noxfile.py'
              - 'pyproject.toml'
              - '.github/workflows/unit.yml'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: github.event_name == 'push' || steps.changes.outputs.gee == 'true'
        with:
          python-version: "3.12"
      - name: Install nox
        if: github.event_name == 'push' || steps.changes.outputs.gee == 'true'
        run: python -m pip install nox
      - name: test GEE smoke tests
        if: github.event_name == 'push' || steps.changes.outputs.gee == 'true'
        run: nox -s test_gee -- -vv
      - name: skip notice
        if: github.event_name != 'push' && steps.changes.outputs.gee != 'true'
        run: echo "No GEE-relevant files changed; skipping test_gee."

  entry-point:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install nox
        run: python -m pip install nox
      - name: test the entrypoints
        run: nox -s bin

  docs:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install nox
        run: python -m pip install nox
      - name: build the documentation and check for warnings
        run: nox -s docs

  apps:
    needs: [build]
    # Templates use SepalMap which calls init_ee() in its constructor; skip on
    # fork PRs since they have no EE creds.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install .[test]
      - name: build the template panel application
        run: pytest --nbmake pysepal/templates/panel_app/ui.ipynb
      - name: build the template map application
        run: pytest --nbmake pysepal/templates/map_app/ui.ipynb
