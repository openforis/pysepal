# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# build with latest available ubuntu version
build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  apt_packages:
    # provides gdal-config for GDAL source builds when no prebuilt wheel
    # is available from the girder large_image_wheels index
    - libgdal-dev
  jobs:
    pre_install:
      # Pin pip GDAL to the system libgdal version exposed by libgdal-dev so
      # the source build (when no prebuilt wheel matches) doesn't pull a
      # newer GDAL whose bindings reject the installed libgdal.
      - pip install --find-links=https://girder.github.io/large_image_wheels --no-cache "GDAL==$(gdal-config --version).*"
    # patch deprecated and sphinx version to mimic nox build
    post_install:
      - pip install sphinx
    pre_build:
      - sphinx-apidoc --force --module-first --templatedir=docs/source/_templates/apidoc -o docs/source/modules ./pysepal

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
